extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  # To New Relic (OTLP endpoint)
  otlp_http/newrelic:
    endpoint: https://staging-otlp.nr-data.net
    headers:
      api-key: "${env:NEW_RELIC_API_KEY}"
    compression: gzip

  # Debug exporter to see data in logs (optional)
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/newrelic, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/newrelic, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/newrelic, debug]
